name: BTC Position Daily
on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: btc-daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run daily
        run: chmod +x run_daily.sh && ./run_daily.sh
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: persist ledger & reports
        if: always()
        run: |
          git config user.name "btc-bot"
          git config user.email "btc-bot@users.noreply.github.com"
          git add -A paper_ledger.csv state.json data/ output/ || true
          if ! git diff --cached --quiet; then
            git commit -m "daily $(date -u +%F)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
